project:
  name: OnlyNativeIQ
  environment: development

knowledge_base:
  root: knowledge_base
  supported_formats:
    - pdf
    - docx
    - txt
  recursive_scan: true
  ignore_hidden_files: true

metadata:
  registry_path: data/metadata/document_registry.json
  schema_path: data/metadata/metadata_schema.json
  manifest_path: data/metadata/corpus_manifest.json
  strict_validation: true
  default_language: en

cleaning:
  normalize_unicode: true
  remove_zero_width_chars: true
  normalize_whitespace: true
  collapse_blank_lines: true

chunking:
  strategy: recursive
  chunk_size: 700
  chunk_overlap: 100
  include_section_title: true
  preserve_table_rows: true
  table_header_repeat: true

embeddings:
  enabled: true
  provider: sentence_transformers
  model_name: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 32
  normalize_embeddings: true
  device: null
  show_progress_bar: true

vector_store:
  enabled: true
  provider: chroma
  distance_metric: cosine

  chroma:
    persist_directory: vector_store/chroma
    collection_name: onlynativeiq

  faiss:
    persist_directory: vector_store/faiss
    index_name: onlynativeiq

bm25:
  enabled: true
  persist_directory: vector_store/bm25
  top_k: 10

  # BM25 tuning
  k1: 1.5
  b: 0.75

  # Tokenization
  lowercase: true
  min_token_length: 1

retrieval:
  # Minimum CrossEncoder reranker score required after access control.
  #
  # Initial baseline:
  #   relevant shelf-life chunk observed around +6.88
  #   unrelated public chunks observed below 0
  #
  # Keep configurable because this should later be tuned from evaluation data.
  minimum_relevance_score: 0.0

vector_retrieval:
  enabled: true
  top_k: 10
  score_threshold: 0.0

hybrid_retrieval:
  enabled: true
  strategy: reciprocal_rank_fusion
  vector_weight: 0.6
  bm25_weight: 0.4
  candidate_pool_size: 20

reranking:
  enabled: true
  provider: cross_encoder
  model_name: cross-encoder/ms-marco-MiniLM-L6-v2
  input_top_k: 20
  output_top_k: 5

grounding:
  minimum_context_chunks: 1
  reject_empty_context: true
  not_found_message: >
    I could not find this information in the available OnlyNative knowledge base.



memory:
  enabled: true # allows memory to be turned off globally 
  strategy: hybrid #recent messages + summary memory
  max_recent_messages: 10 #controls ConversationMemory.max_turns
  summary_enabled: true #controls whether summary memory is active



evaluation:
  questions_path: data/evaluation/evaluation_questions.jsonl
  retrieval_ground_truth_path: data/evaluation/retrieval_ground_truth.jsonl
  negative_questions_path: data/evaluation/negative_questions.jsonl
  retrieval_top_k: 5

diagnostics:
  print_chunks: false
  print_chunk_metadata: false
  max_chunks_to_print: null
  max_chunk_content_chars: null

logging:
  level: INFO
  log_directory: logs
  log_file: onlynativeiq.log


# Add/replace this section in config/settings.yaml

hybrid_retrieval:
  enabled: true

  # Reciprocal Rank Fusion combines ranks, not raw Vector/BM25 scores.
  strategy: reciprocal_rank_fusion

  # Relative contribution of each retrieval path.
  vector_weight: 0.55
  bm25_weight: 0.45

  # Number of candidates requested independently from Vector and BM25.
  candidate_pool_size: 20

  # Number returned after hybrid fusion.
  output_top_k: 10

  # Standard RRF rank constant. Higher values flatten rank differences.
  rrf_k: 60


  # Add/replace this section in config/settings.yaml

reranking:
  enabled: true
  provider: cross_encoder

  model_name: cross-encoder/ms-marco-MiniLM-L6-v2

  # Number of Hybrid-RRF candidates sent to CrossEncoder.
  input_top_k: 20

  # Final number returned after reranking.
  output_top_k: 5

  batch_size: 16

  # null lets sentence-transformers choose CPU/GPU automatically.
  device: null


# Add/replace this section in config/settings.yaml

security:
  enforce_access_control: true

  # Missing/unknown access classifications fail closed.
  default_access_level: unclassified
  deny_unclassified_documents: true

  # Rerank more candidates than are finally returned so filtering can safely
  # remove restricted content without leaving the generator with no context.
  pre_filter_top_k: 20

  # Final authorized chunks made available to downstream grounding/generation.
  final_top_k: 5


generation:
  grounding:
    max_context_characters: 12000

  answer:
    temperature: 0.0
    max_tokens: 800

  behavior:
    answer_only_from_context: true
    refuse_unsupported_answers: true
    include_sources: true

llm:
  # Supported:
  #   gemini
  #   groq
  #   openai
  provider: openai

  temperature: 0.0
  max_tokens: 800

  gemini:
    model: gemini-2.5-flash

  groq:
    model: llama-3.3-70b-versatile

  openai:
    model: gpt-4o-mini